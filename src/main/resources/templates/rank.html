<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ranking de Usuários</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 20px 0;
            background-color: #1a1a1a;
            border-bottom: 2px solid #444;
        }

        header img {
            max-height: 80px;
        }

        h1 {
            margin-top: 20px;
            text-align: center;
            font-size: 2.5rem;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
            width: 80%;
            max-width: 800px;
            background-color: #1a1a1a;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #2a2a2a;
            font-size: 1.1rem;
            color: #ffffff;
        }

        tr:nth-child(1) {
            background-color: #ffd700;
            color: #000;
            font-weight: bold;
        }

        tr:nth-child(2) {
            background-color: #c0c0c0;
            color: #000;
        }

        tr:nth-child(3) {
            background-color: #cd7f32;
            color: #000;
        }

        tr:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <header>
        <!-- Substitua essa URL pela imagem real da logo se estiver em sua pasta static ou assets -->
        <img src="/images/furia-logo.png" alt="Logo FURIA">
    </header>

    <h1>Top 10 - Ranking de XP</h1>

    <table>
        <thead>
            <tr>
                <th>Posição</th>
                <th>Nome</th>
                <th>XP</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario, iterStat : ${usuarios}">
                <td th:text="${iterStat.index + 1}"></td>
                <td th:text="${usuario.nome}"></td>
                <td th:text="${usuario.xp}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
