<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Missão</title>
</head>
<body>
    <h1>Criar Missão</h1>

    <form action="/missao/criar" method="post">
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" required><br>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" name="descricao" required></textarea><br>

        <label for="dataInicio">Data de Início:</label>
        <input type="date" id="dataInicio" name="dataInicio" required><br>

        <label for="dataFim">Data de Fim:</label>
        <input type="date" id="dataFim" name="dataFim" required><br>

        <label for="pontos">Pontos:</label>
        <input type="number" id="pontos" name="pontos" required><br>

        <button type="submit">Criar Missão</button>
    </form>
</body>
</html>
